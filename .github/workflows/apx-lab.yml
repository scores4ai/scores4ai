name: Build APX prediction laboratory

on:
  workflow_dispatch:
  push:
    paths:
      - "apx/engine.py"
      - "apx/index.html"
      - ".github/workflows/apx-lab.yml"
  schedule:
    - cron: "4-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: apx-lab
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Follow live feed for five minutes
        run: |
          git config user.name "apx-research-bot"
          git config user.email "apx-research-bot@users.noreply.github.com"

          for cycle in 1 2 3 4; do
            echo "APX live cycle $cycle"
            git fetch origin main
            git reset --hard origin/main
            python apx/engine.py

            python - <<'PY'
          import json
          s=json.load(open('apx/state.json'))
          assert s['nextDraw']==s['latestDraw']+1
          assert len(s['top5'])==5 and len(set(s['top5']))==5
          assert s['modelCount']>=40
          assert s['leaderboard']
          print('APX validated:',s['latestDraw'],s['nextDraw'],s['modelCount'],s['top5'])
          PY

            git add apx/state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update APX tournament state"
              for attempt in 1 2 3; do
                git pull --rebase origin main && git push origin main && break
                echo "Push retry $attempt"
                sleep 5
              done
            else
              echo "No APX state change"
            fi

            if [ "$cycle" -lt 4 ]; then sleep 70; fi
          done
