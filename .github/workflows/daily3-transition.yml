name: Daily 3 position transition test

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "daily3/transition_replay.py"
      - "daily3/archive.json"
      - "daily3/baseline_results.json"
      - ".github/workflows/daily3-transition.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python daily3/transition_replay.py
      - name: Verify and commit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('daily3/transition_results.json').read_text())
          assert d['transitionResult']['tested']==11900
          assert d['integrity']['futureDataAccess'] is False
          assert len(d['resultSha256'])==64
          print(d['transitionResult'])
          PY
          git config user.name "daily3-research-bot"
          git config user.email "daily3-research-bot@users.noreply.github.com"
          git add daily3/transition_results.json
          git commit -m "Update Daily 3 transition model results" || exit 0
          git pull --rebase origin main
          git push origin main
