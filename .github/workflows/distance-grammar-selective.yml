name: Selective distance grammar sealed backtest
on:
  workflow_dispatch:
  push:
    paths:
      - "research/distance_grammar_selective_v1.py"
      - ".github/workflows/distance-grammar-selective.yml"
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python research/distance_grammar_selective_v1.py
      - run: |
          git config user.name "pattern-research-bot"
          git config user.email "pattern-research-bot@users.noreply.github.com"
          git add research/distance_grammar_selective_v1_results.json
          if ! git diff --cached --quiet; then
            git commit -m "Selective distance grammar sealed result"
            git pull --rebase origin main
            git push origin main
          fi
