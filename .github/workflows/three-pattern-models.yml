name: Three pattern models sealed backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "research/three_pattern_models.py"
      - ".github/workflows/three-pattern-models.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run sealed three-model walk-forward test
        run: python research/three_pattern_models.py
      - name: Commit result snapshot
        run: |
          git config user.name "pattern-research-bot"
          git config user.email "pattern-research-bot@users.noreply.github.com"
          git add research/three_pattern_models_results.json
          if ! git diff --cached --quiet; then
            git commit -m "Three pattern models sealed result"
            git pull --rebase origin main
            git push origin main
          fi
