name: Daily 3 historical archive

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "daily3/archive_builder.py"
      - ".github/workflows/daily3-archive.yml"

permissions:
  contents: write

concurrency:
  group: daily3-archive
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Daily 3 archive
        run: python daily3/archive_builder.py

      - name: Validate archive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('daily3/archive.json').read_text())
          v=d['validation']
          assert d['drawCount'] == len(d['draws'])
          assert d['drawCount'] >= 1000, f"archive too small: {d['drawCount']}"
          assert v['conflicts'] == 0
          assert v['invalidDigitRows'] == 0
          assert v['chronological'] is True
          assert len(d['sha256']) == 64
          assert all(len(r['digits']) == 3 for r in d['draws'])
          assert all(r['number'] == ''.join(str(x) for x in r['digits']) for r in d['draws'])
          assert all(r['drawType'] in ('midday','evening') for r in d['draws'])
          print(json.loads(Path('daily3/archive_summary.json').read_text()))
          PY

      - name: Commit validated archive
        run: |
          git config user.name "daily3-archive-bot"
          git config user.email "daily3-archive-bot@users.noreply.github.com"
          git add daily3/archive.json daily3/archive_summary.json
          if git diff --cached --quiet; then
            echo "Archive already current"
            exit 0
          fi
          git commit -m "Update validated Michigan Daily 3 archive"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 4
          done
          exit 1
