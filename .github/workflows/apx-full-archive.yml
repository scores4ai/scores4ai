name: APX full Cash Pop archive

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "apx/archive_builder_v2.py"
      - ".github/workflows/apx-full-archive.yml"
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: apx-full-archive
  cancel-in-progress: false

jobs:
  build-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build timestamp-anchored archive
        run: python apx/archive_builder_v2.py

      - name: Verify and summarize archive integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('apx/full_archive.json').read_text())
          v=d['validation']
          assert d['drawCount'] == len(d['draws'])
          assert d['drawCount'] > 1000, f"archive too small: {d['drawCount']}"
          assert v['duplicateDrawIds'] == 0
          assert v['numbersOutside1To15'] == 0
          assert v['chronological'] is True
          assert d['anchor']['agreeing'] >= 1
          assert len(d['sha256']) == 64
          summary={
            'version':d['version'],
            'updatedAt':d['updatedAt'],
            'drawCount':d['drawCount'],
            'firstDraw':d['firstDraw'],
            'latestDraw':d['latestDraw'],
            'sha256':d['sha256'],
            'anchor':d['anchor'],
            'validation':v,
            'sourceYears':[2024,2025,2026],
            'status':'VALIDATED'
          }
          Path('apx/full_archive_summary.json').write_text(json.dumps(summary,indent=2))
          print(summary)
          PY

      - name: Commit archive and summary only
        run: |
          git config user.name "apx-archive-bot"
          git config user.email "apx-archive-bot@users.noreply.github.com"
          git add apx/full_archive.json apx/full_archive_summary.json
          if git diff --cached --quiet; then
            echo "Archive already current"
            exit 0
          fi
          git commit -m "Update immutable Cash Pop historical archive"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 4
          done
          exit 1
