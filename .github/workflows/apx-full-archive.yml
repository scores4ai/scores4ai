name: APX full Cash Pop archive

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "apx/archive_builder.py"
      - ".github/workflows/apx-full-archive.yml"
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: apx-full-archive
  cancel-in-progress: false

jobs:
  build-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate immutable archive
        run: python apx/archive_builder.py

      - name: Verify archive integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('apx/full_archive.json')
          assert p.exists(), 'archive was not created'
          d=json.loads(p.read_text())
          v=d['validation']
          assert d['drawCount'] == len(d['draws'])
          assert v['duplicateDrawIds'] == 0
          assert v['conflicts'] == 0
          assert v['numbersOutside1To15'] == 0
          assert v['chronological'] is True
          assert len(d['sha256']) == 64
          print({'drawCount':d['drawCount'],'firstDraw':d['firstDraw'],'latestDraw':d['latestDraw'],'missingIds':v['missingDrawIdCount']})
          PY

      - name: Commit archive only
        run: |
          git config user.name "apx-archive-bot"
          git config user.email "apx-archive-bot@users.noreply.github.com"
          git add apx/full_archive.json
          if git diff --cached --quiet; then
            echo "Archive already current"
            exit 0
          fi
          git commit -m "Update immutable Cash Pop historical archive"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 4
          done
          exit 1
