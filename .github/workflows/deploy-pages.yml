name: Deploy predictor to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "v0/final.html"
      - "v0/cloud_state.json"
      - "apx/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          test -f v0/final.html
          test -f v0/cloud_state.json
          test -f apx/index.html
          test -f apx/evolution.html
          test -f apx/state.json

      - name: Build site folder
        run: |
          rm -rf _site
          mkdir -p _site/apx
          cp v0/final.html _site/index.html
          cp v0/cloud_state.json _site/cloud_state.json
          cp apx/index.html _site/apx/index.html
          cp apx/evolution.html _site/apx/evolution.html
          cp apx/state.json _site/apx/state.json
          if [ -f apx/evolution_state.json ]; then cp apx/evolution_state.json _site/apx/evolution_state.json; fi
          if [ -f apx/heartbeat.json ]; then cp apx/heartbeat.json _site/apx/heartbeat.json; fi
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
