name: Michigan Cash Pop staggered fast watcher

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cash-pop-minute-watcher.yml"
      - "v0/minute_watcher.py"
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: cash-pop-fast-watcher
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright
          playwright install chromium

      - name: Fetch newest draw once
        run: |
          git config user.name "cash-pop-live-bot"
          git config user.email "cash-pop-live-bot@users.noreply.github.com"
          python v0/minute_watcher.py
