name: Michigan Cash Pop persistent live watcher

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cash-pop-minute-watcher.yml"
      - "v0/minute_watcher.py"
      - "v0/ultra_live_runner.py"
  schedule:
    - cron: "0,30 * * * *"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install persistent watcher browser
        run: |
          pip install playwright
          playwright install chromium

      - name: Poll newest draw every five seconds
        run: |
          git config user.name "cash-pop-live-bot"
          git config user.email "cash-pop-live-bot@users.noreply.github.com"
          python v0/ultra_live_runner.py
