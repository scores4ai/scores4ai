name: Publish Predictor Website

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "v0/final.html"
      - "v0/live2.html"
      - "v1/index.html"
      - "apx/index.html"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable GitHub Pages for Actions if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}')
          echo "Pages enable response: $code"
          cat /tmp/pages.json || true

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site/v0 _site/v1 _site/apx
          cp index.html _site/index.html
          cp v0/final.html _site/v0/final.html
          cp v0/live2.html _site/v0/live2.html
          cp v0/cloud_state.json _site/v0/cloud_state.json
          cp v0/cloud_state.json _site/cloud_state.json
          cp v1/index.html _site/v1/index.html
          cp v1/cloud_state.json _site/v1/cloud_state.json
          cp apx/index.html _site/apx/index.html
          cp apx/state.json _site/apx/state.json
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/v0/live2.html
          test -s _site/v1/index.html
          test -s _site/apx/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
