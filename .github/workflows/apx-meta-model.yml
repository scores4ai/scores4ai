name: APX non-voting meta-model sandbox

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "apx/meta_model_sandbox.py"
      - "apx/full_archive.json"
      - ".github/workflows/apx-meta-model.yml"

permissions:
  contents: write

concurrency:
  group: apx-meta-model
  cancel-in-progress: true

jobs:
  test-meta-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Train and test locked meta-model
        run: python apx/meta_model_sandbox.py
      - name: Verify untouched holdout integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('apx/meta_model_results.json').read_text())
          assert d['trainingDraws']==5000
          assert d['untouchedHoldoutDraws']==3000
          assert d['integrity']['futureDataAccess'] is False
          assert d['integrity']['policyLockedBeforeHoldout'] is True
          assert d['integrity']['holdoutUpdates'] is False
          assert d['integrity']['featuresComputedBeforeReveal'] is True
          assert d['holdoutStartDraw'] > d['trainingEndDraw']
          assert d['metaResult']['tested']==3000
          assert all(x['tested']==3000 for x in d['leaderboard'])
          assert len(d['resultSha256'])==64
          print({'meta':d['metaResult'],'bestBase':d['bestBaseModel'],'contexts':d['learnedContexts']})
          PY
      - name: Commit sandbox results
        run: |
          git config user.name "apx-meta-bot"
          git config user.email "apx-meta-bot@users.noreply.github.com"
          git add apx/meta_model_results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update untouched-holdout meta-model results"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 4
          done
          exit 1
