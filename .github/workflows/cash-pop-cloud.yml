name: Update Michigan Cash Pop predictor data

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: write

concurrency:
  group: cash-pop-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rendered browser scraper
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Fetch live results and update model
        run: python v0/github_updater.py

      - name: Verify state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('v0/cloud_state.json').read_text())
          assert s.get('draws'), 'No draws stored'
          assert s.get('pending'), 'No prediction generated'
          assert s['pending']['draw'] == s['latestDraw'] + 1
          print('Latest:', s['latestDraw'], 'Next:', s['pending']['draw'], 'Draws:', len(s['draws']))
          PY

      - name: Commit updated state
        run: |
          git config user.name "cash-pop-bot"
          git config user.email "cash-pop-bot@users.noreply.github.com"
          git add v0/cloud_state.json
          git diff --cached --quiet || git commit -m "Update Cash Pop predictor state"
          git pull --rebase
          git push
