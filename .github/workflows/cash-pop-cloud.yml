name: Michigan Cash Pop continuous updater

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cash-pop-cloud.yml"
      - "v0/github_updater.py"
      - "v0/fresh_runner.py"
  schedule:
    - cron: "2 * * * *"

permissions:
  contents: write

concurrency:
  group: cash-pop-continuous
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser fallback
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Poll every minute and publish immediately
        shell: bash
        run: |
          set +e
          git config user.name "cash-pop-bot"
          git config user.email "cash-pop-bot@users.noreply.github.com"

          for pass in $(seq 1 57); do
            echo "===== live pass $pass at $(date -u) ====="
            git pull --rebase origin main || true
            python v0/fresh_runner.py
            status=$?

            if [ $status -eq 0 ]; then
              python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('v0/cloud_state.json').read_text())
          assert s.get('draws')
          assert s.get('pending')
          assert s['pending']['draw']==s['latestDraw']+1
          print('Latest',s['latestDraw'],'Next',s['pending']['draw'],'Updated',s.get('updatedAt'))
          PY
              git add v0/cloud_state.json
              if ! git diff --cached --quiet; then
                git commit -m "Live Cash Pop update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                git pull --rebase origin main || true
                git push origin main || true
              fi
            else
              echo "Fetch failed; retrying in one minute"
            fi

            sleep 60
          done
