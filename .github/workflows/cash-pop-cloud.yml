name: Michigan Cash Pop fast live updater

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cash-pop-cloud.yml"
      - ".github/workflows/cash-pop-backup.yml"
      - "v0/robust_runner.py"
      - "apx/engine.py"
      - "apx/retirement.py"
      - "apx/evolution.py"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: cash-pop-fast-primary
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install browser fallback
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Four rapid live checks
        shell: bash
        run: |
          set +e
          git config user.name "cash-pop-bot"
          git config user.email "cash-pop-bot@users.noreply.github.com"

          for pass in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main

            python v0/robust_runner.py
            source_status=$?
            apx_status=1
            evolution_status=1
            retirement_status=1

            if [ $source_status -eq 0 ]; then
              python apx/engine.py
              apx_status=$?
            fi

            # Research modules are non-blocking. Evolution runs first;
            # retirement runs last so the published prediction remains filtered.
            if [ $apx_status -eq 0 ]; then
              python apx/evolution.py
              evolution_status=$?
              python apx/retirement.py
              retirement_status=$?
            fi

            SOURCE_STATUS=$source_status APX_STATUS=$apx_status RETIREMENT_STATUS=$retirement_status EVOLUTION_STATUS=$evolution_status PASS_NUMBER=$pass UPDATER_NAME=primary python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          path=Path('apx/heartbeat.json')
          try: old=json.loads(path.read_text())
          except Exception: old={}
          source_ok=os.environ['SOURCE_STATUS']=='0'
          apx_ok=os.environ['APX_STATUS']=='0'
          retirement_ok=os.environ['RETIREMENT_STATUS']=='0'
          evolution_ok=os.environ['EVOLUTION_STATUS']=='0'
          core_ok=source_ok and apx_ok
          latest=0
          try: latest=json.loads(Path('apx/state.json').read_text()).get('latestDraw',0)
          except Exception: pass
          now=datetime.now(timezone.utc).isoformat()
          out={
            'updater':os.environ['UPDATER_NAME'],
            'pass':int(os.environ['PASS_NUMBER']),
            'lastAttemptAt':now,
            'lastSuccessAt':now if core_ok else old.get('lastSuccessAt'),
            'success':core_ok,
            'sourceSuccess':source_ok,
            'apxSuccess':apx_ok,
            'retirementSuccess':retirement_ok,
            'evolutionSuccess':evolution_ok,
            'researchHealthy':retirement_ok and evolution_ok,
            'latestDraw':latest,
            'consecutiveFailures':0 if core_ok else int(old.get('consecutiveFailures',0))+1,
            'pollIntervalSeconds':65,
            'architecture':'core-live-independent-of-research-modules'
          }
          path.write_text(json.dumps(out,indent=2))
          PY

            # Never fail because an optional generated file is absent.
            git add v0/cloud_state.json
            git add -A apx
            if ! git diff --cached --quiet; then
              git commit -m "Fast Cash Pop poll $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              pushed=false
              for attempt in 1 2 3; do
                if git pull --rebase origin main && git push origin main; then
                  pushed=true
                  break
                fi
                sleep 4
              done
              if [ "$pushed" != true ]; then echo "Publish failed on pass $pass"; fi
            fi

            if [ "$pass" -lt 4 ]; then sleep 65; fi
          done
