name: Michigan Cash Pop resilient live updater

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cash-pop-cloud.yml"
      - "v0/github_updater.py"
      - "v0/fresh_runner.py"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: cash-pop-resilient-live
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser fallback
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Poll repeatedly and publish new draws
        shell: bash
        run: |
          set +e
          git config user.name "cash-pop-bot"
          git config user.email "cash-pop-bot@users.noreply.github.com"

          for pass in 1 2 3 4; do
            echo "===== live pass $pass at $(date -u) ====="
            git fetch origin main
            git reset --hard origin/main

            python v0/fresh_runner.py
            status=$?

            if [ $status -eq 0 ]; then
              python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('v0/cloud_state.json').read_text())
          assert s.get('draws')
          assert s.get('pending')
          assert s['pending']['draw'] == s['latestDraw'] + 1
          print('Latest', s['latestDraw'], 'Next', s['pending']['draw'], 'Updated', s.get('updatedAt'))
          PY

              git add v0/cloud_state.json
              if ! git diff --cached --quiet; then
                git commit -m "Live Cash Pop update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                for attempt in 1 2 3; do
                  git pull --rebase origin main && git push origin main && break
                  echo "Push retry $attempt"
                  sleep 5
                done
              else
                echo "No new draw found on pass $pass"
              fi
            else
              echo "Source fetch failed on pass $pass"
            fi

            if [ "$pass" -lt 4 ]; then sleep 65; fi
          done
