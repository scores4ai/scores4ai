name: Michigan Cash Pop live updater

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cash-pop-cloud.yml"
      - ".github/workflows/cash-pop-backup.yml"
      - "v0/robust_runner.py"
      - "apx/engine.py"
      - "apx/retirement.py"
      - "apx/evolution.py"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: cash-pop-primary
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          playwright install chromium

      - name: Fetch, rebuild, and publish once
        shell: bash
        run: |
          set +e
          git config user.name "cash-pop-bot"
          git config user.email "cash-pop-bot@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          python v0/robust_runner.py
          source_status=$?
          apx_status=1
          evolution_status=1
          retirement_status=1

          if [ $source_status -eq 0 ]; then
            python apx/engine.py
            apx_status=$?
          fi
          if [ $apx_status -eq 0 ]; then
            python apx/evolution.py
            evolution_status=$?
            python apx/retirement.py
            retirement_status=$?
          fi

          SOURCE_STATUS=$source_status APX_STATUS=$apx_status RETIREMENT_STATUS=$retirement_status EVOLUTION_STATUS=$evolution_status python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path=Path('apx/heartbeat.json')
          try: old=json.loads(path.read_text())
          except Exception: old={}
          source_ok=os.environ['SOURCE_STATUS']=='0'
          apx_ok=os.environ['APX_STATUS']=='0'
          core_ok=source_ok and apx_ok
          try: latest=json.loads(Path('apx/state.json').read_text()).get('latestDraw',0)
          except Exception: latest=0
          now=datetime.now(timezone.utc).isoformat()
          path.write_text(json.dumps({
            'updater':'primary','pass':1,'lastAttemptAt':now,
            'lastSuccessAt':now if core_ok else old.get('lastSuccessAt'),
            'success':core_ok,'sourceSuccess':source_ok,'apxSuccess':apx_ok,
            'retirementSuccess':os.environ['RETIREMENT_STATUS']=='0',
            'evolutionSuccess':os.environ['EVOLUTION_STATUS']=='0',
            'researchHealthy':os.environ['RETIREMENT_STATUS']=='0' and os.environ['EVOLUTION_STATUS']=='0',
            'latestDraw':latest,
            'consecutiveFailures':0 if core_ok else int(old.get('consecutiveFailures',0))+1,
            'scheduledIntervalMinutes':5,
            'architecture':'single-complete-poll-no-cache-startup'
          },indent=2))
          PY

          git add v0/cloud_state.json
          git add -A apx
          if ! git diff --cached --quiet; then
            git commit -m "Cash Pop live poll $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin main && exit 0
              sleep 4
            done
            exit 1
          fi
