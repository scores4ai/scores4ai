name: Michigan Cash Pop continuous live updater

on:
  workflow_dispatch:
  schedule:
    - cron: "2 * * * *"

permissions:
  contents: write

concurrency:
  group: cash-pop-continuous-live
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser fallback
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Poll every minute, rebuild APX, and publish atomically
        shell: bash
        run: |
          set +e
          git config user.name "cash-pop-bot"
          git config user.email "cash-pop-bot@users.noreply.github.com"

          for pass in $(seq 1 50); do
            echo "===== continuous pass $pass at $(date -u) ====="
            git fetch origin main
            git reset --hard origin/main

            before_draw=$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path('v0/cloud_state.json').read_text()).get('latestDraw', 0))
          except Exception:
              print(0)
          PY
          )

            python v0/robust_runner.py
            source_status=$?

            if [ $source_status -eq 0 ]; then
              python apx/engine.py
              apx_status=$?

              if [ $apx_status -eq 0 ]; then
                python - <<'PY'
          import json
          from pathlib import Path
          live=json.loads(Path('v0/cloud_state.json').read_text())
          apx=json.loads(Path('apx/state.json').read_text())
          assert live.get('draws') and live.get('pending')
          assert live['pending']['draw'] == live['latestDraw'] + 1
          assert apx['latestDraw'] == live['latestDraw']
          assert apx['nextDraw'] == live['latestDraw'] + 1
          assert apx.get('pendingPrediction', {}).get('draw') == apx['nextDraw']
          print('Atomic update verified:', live['latestDraw'], apx['latestDraw'], apx['nextDraw'])
          PY

                after_draw=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('v0/cloud_state.json').read_text()).get('latestDraw', 0))
          PY
          )

                # Publish when a new draw arrives. Also publish a heartbeat every five passes
                # so the dashboard can distinguish a running poller from a stopped workflow.
                if [ "$after_draw" != "$before_draw" ] || [ $((pass % 5)) -eq 0 ]; then
                  git add v0/cloud_state.json apx/state.json
                  if ! git diff --cached --quiet; then
                    git commit -m "Live Cash Pop and APX update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                    pushed=false
                    for attempt in 1 2 3; do
                      if git pull --rebase origin main && git push origin main; then
                        pushed=true
                        break
                      fi
                      echo "Push retry $attempt"
                      sleep 5
                    done
                    if [ "$pushed" != true ]; then
                      echo "Unable to publish pass $pass"
                    fi
                  fi
                else
                  echo "No new draw on pass $pass; continuing"
                fi
              else
                echo "APX rebuild failed on pass $pass"
              fi
            else
              echo "Source fetch failed on pass $pass"
            fi

            if [ "$pass" -lt 50 ]; then sleep 60; fi
          done
