name: Michigan Cash Pop live updater

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cash-pop-cloud.yml"
      - "v0/github_updater.py"
      - "v0/fresh_runner.py"
  schedule:
    - cron: "1-56/5 * * * *"

permissions:
  contents: write

concurrency:
  group: cash-pop-live-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser fallback
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Poll twice, score, predict, and publish
        shell: bash
        run: |
          set -e
          git config user.name "cash-pop-bot"
          git config user.email "cash-pop-bot@users.noreply.github.com"

          for pass in 1 2; do
            echo "===== live pass $pass at $(date -u) ====="
            git pull --rebase origin main
            python v0/fresh_runner.py
            python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('v0/cloud_state.json').read_text())
          assert s.get('draws')
          assert s.get('pending')
          assert s['pending']['draw']==s['latestDraw']+1
          print('Latest',s['latestDraw'],'Next',s['pending']['draw'],'Updated',s.get('updatedAt'))
          PY
            git add v0/cloud_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update live Cash Pop state"
              git pull --rebase origin main
              git push origin main
            fi
            if [ "$pass" = "1" ]; then sleep 120; fi
          done
