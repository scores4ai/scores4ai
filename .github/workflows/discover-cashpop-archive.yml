name: Discover Michigan Cash Pop archive
on:
  workflow_dispatch:
  push:
    paths:
      - "research/discover_cashpop_archive.py"
      - ".github/workflows/discover-cashpop-archive.yml"
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python research/discover_cashpop_archive.py
      - run: |
          git config user.name "archive-research-bot"
          git config user.email "archive-research-bot@users.noreply.github.com"
          git add research/archive_discovery.json
          if ! git diff --cached --quiet; then
            git commit -m "Michigan Cash Pop archive discovery result"
            git pull --rebase origin main
            git push origin main
          fi
