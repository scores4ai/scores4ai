name: Daily 3 rolling block stability

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "daily3/rolling_block_challenge.py"
      - "daily3/archive.json"
      - ".github/workflows/daily3-rolling-block.yml"

permissions:
  contents: write

concurrency:
  group: daily3-rolling-block-optimized
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run optimized rolling block challenge
        run: python daily3/rolling_block_challenge.py
      - name: Verify result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('daily3/rolling_block_results.json').read_text())
          assert d['blockCount'] >= 10
          assert d['blockSize'] == 1000
          assert d['integrity']['futureDataAccess'] is False
          assert len(d['overall']) == 4
          assert len(d['resultSha256']) == 64
          print(json.dumps({'blocks': d['blockCount'], 'overall': d['overall']}))
          PY
      - name: Commit result
        run: |
          git config user.name "daily3-research-bot"
          git config user.email "daily3-research-bot@users.noreply.github.com"
          git add daily3/rolling_block_results.json
          git commit -m "Update Daily 3 optimized rolling block results" || exit 0
          git pull --rebase origin main
          git push origin main
