name: Michigan Cash Pop staggered backup updater

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cash-pop-backup.yml"
      - "apx/ledger.py"
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: cash-pop-backup
  cancel-in-progress: false

jobs:
  backup-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether primary is stale
        id: stale
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          stale=True
          try:
              h=json.loads(Path('apx/heartbeat.json').read_text())
              t=datetime.fromisoformat(h['lastSuccessAt'].replace('Z','+00:00'))
              stale=(datetime.now(timezone.utc)-t).total_seconds()>420
          except Exception:
              pass
          print('run=' + ('true' if stale else 'false'))
          PY

      - name: Install browser
        if: steps.stale.outputs.run == 'true'
        run: |
          python -m pip install --disable-pip-version-check playwright
          playwright install chromium

      - name: Fetch, rebuild, audit, and publish once
        if: steps.stale.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          git config user.name "cash-pop-backup-bot"
          git config user.email "cash-pop-backup-bot@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          python v0/robust_runner.py
          source_status=$?
          apx_status=1
          evolution_status=1
          retirement_status=1
          ledger_status=1
          if [ $source_status -eq 0 ]; then
            python apx/engine.py
            apx_status=$?
          fi
          if [ $apx_status -eq 0 ]; then
            python apx/evolution.py
            evolution_status=$?
            python apx/retirement.py
            retirement_status=$?
            python apx/ledger.py
            ledger_status=$?
          fi

          SOURCE_STATUS=$source_status APX_STATUS=$apx_status RETIREMENT_STATUS=$retirement_status EVOLUTION_STATUS=$evolution_status LEDGER_STATUS=$ledger_status python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path=Path('apx/heartbeat.json')
          try: old=json.loads(path.read_text())
          except Exception: old={}
          source_ok=os.environ['SOURCE_STATUS']=='0'
          apx_ok=os.environ['APX_STATUS']=='0'
          core_ok=source_ok and apx_ok
          try: latest=json.loads(Path('apx/state.json').read_text()).get('latestDraw',0)
          except Exception: latest=0
          now=datetime.now(timezone.utc).isoformat()
          path.write_text(json.dumps({
            'updater':'backup','pass':1,'lastAttemptAt':now,
            'lastSuccessAt':now if core_ok else old.get('lastSuccessAt'),
            'success':core_ok,'sourceSuccess':source_ok,'apxSuccess':apx_ok,
            'retirementSuccess':os.environ['RETIREMENT_STATUS']=='0',
            'evolutionSuccess':os.environ['EVOLUTION_STATUS']=='0',
            'ledgerSuccess':os.environ['LEDGER_STATUS']=='0',
            'researchHealthy':all(os.environ[x]=='0' for x in ('RETIREMENT_STATUS','EVOLUTION_STATUS','LEDGER_STATUS')),
            'latestDraw':latest,
            'consecutiveFailures':0 if core_ok else int(old.get('consecutiveFailures',0))+1,
            'scheduledIntervalMinutes':5,
            'architecture':'backup-live-core-plus-permanent-draw-ledger'
          },indent=2))
          PY

          git add v0/cloud_state.json
          git add -A apx
          if ! git diff --cached --quiet; then
            git commit -m "Backup Cash Pop poll $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin main && exit 0
              sleep 4
            done
            exit 1
          fi
