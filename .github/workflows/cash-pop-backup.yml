name: Michigan Cash Pop staggered backup updater

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: cash-pop-staggered-backup
  cancel-in-progress: false

jobs:
  backup-update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether primary is stale
        id: stale
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          stale=True
          try:
              h=json.loads(Path('apx/heartbeat.json').read_text())
              t=datetime.fromisoformat(h['lastSuccessAt'].replace('Z','+00:00'))
              stale=(datetime.now(timezone.utc)-t).total_seconds()>210
          except Exception:
              pass
          print('run=' + ('true' if stale else 'false'))
          PY

      - name: Install browser
        if: steps.stale.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run backup checks
        if: steps.stale.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          git config user.name "cash-pop-backup-bot"
          git config user.email "cash-pop-backup-bot@users.noreply.github.com"

          for pass in 1 2; do
            git fetch origin main
            git reset --hard origin/main
            python v0/robust_runner.py
            source_status=$?
            apx_status=1
            evolution_status=1
            if [ $source_status -eq 0 ]; then
              python apx/engine.py
              apx_status=$?
              if [ $apx_status -eq 0 ]; then
                python apx/evolution.py
                evolution_status=$?
              fi
            fi

            SOURCE_STATUS=$source_status APX_STATUS=$apx_status EVOLUTION_STATUS=$evolution_status PASS_NUMBER=$pass python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path=Path('apx/heartbeat.json')
          try: old=json.loads(path.read_text())
          except Exception: old={}
          source_ok=os.environ['SOURCE_STATUS']=='0'
          apx_ok=os.environ['APX_STATUS']=='0'
          evolution_ok=os.environ['EVOLUTION_STATUS']=='0'
          ok=source_ok and apx_ok and evolution_ok
          latest=0
          try: latest=json.loads(Path('apx/state.json').read_text()).get('latestDraw',0)
          except Exception: pass
          now=datetime.now(timezone.utc).isoformat()
          path.write_text(json.dumps({
            'updater':'backup',
            'pass':int(os.environ['PASS_NUMBER']),
            'lastAttemptAt':now,
            'lastSuccessAt':now if ok else old.get('lastSuccessAt'),
            'success':ok,
            'sourceSuccess':source_ok,
            'apxSuccess':apx_ok,
            'evolutionSuccess':evolution_ok,
            'latestDraw':latest,
            'consecutiveFailures':0 if ok else int(old.get('consecutiveFailures',0))+1,
            'pollIntervalSeconds':65,
            'architecture':'primary-fast-plus-staggered-backup'
          },indent=2))
          PY

            git add v0/cloud_state.json apx/state.json apx/heartbeat.json
            if ! git diff --cached --quiet; then
              git commit -m "Backup Cash Pop poll $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              for attempt in 1 2 3; do
                git pull --rebase origin main && git push origin main && break
                sleep 4
              done
            fi
            if [ "$pass" -lt 2 ]; then sleep 65; fi
          done
