name: Build clean Cash Pop archive
on:
  workflow_dispatch:
  push:
    paths:
      - "research/build_clean_cashpop_archive.py"
      - ".github/workflows/build-clean-cashpop-archive.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python research/build_clean_cashpop_archive.py
      - run: |
          git config user.name "archive-research-bot"
          git config user.email "archive-research-bot@users.noreply.github.com"
          git add research/cashpop_clean_archive.json research/cashpop_clean_archive_meta.json
          if ! git diff --cached --quiet; then
            git commit -m "Build clean Cash Pop historical archive"
            git pull --rebase origin main
            git push origin main
          fi
