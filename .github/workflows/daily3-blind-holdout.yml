name: Daily 3 blind holdout
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "daily3/blind_holdout.py"
      - "daily3/archive.json"
      - ".github/workflows/daily3-blind-holdout.yml"
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python daily3/blind_holdout.py
      - name: Verify locked holdout
        run: |
          python - <<'PY'
          import json
          d=json.load(open('daily3/blind_holdout_results.json'))
          assert d['split']['blindHoldoutDraws']==1815
          assert d['integrity']['holdoutUpdates'] is False
          assert d['integrity']['futureDataAccess'] is False
          assert len(d['leaderboard'])==4
          assert len(d['resultSha256'])==64
          print(d['leaderboard'])
          PY
      - name: Commit result
        run: |
          git config user.name "daily3-research-bot"
          git config user.email "daily3-research-bot@users.noreply.github.com"
          git add daily3/blind_holdout_results.json
          git commit -m "Update Daily 3 blind holdout results" || exit 0
          git pull --rebase origin main
          git push origin main
