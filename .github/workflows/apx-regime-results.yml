name: APX regime results

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "apx/regime_results.py"
      - "apx/historical_replay.py"
      - "apx/full_archive.json"
      - ".github/workflows/apx-regime-results.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run 5000-draw regime analysis
        run: python apx/regime_results.py
      - name: Verify results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('apx/regime_results.json').read_text())
          assert d['steps']==5000
          assert d['futureDataAccess'] is False
          assert d['featuresComputedBeforeReveal'] is True
          assert len(d['overall'])>=8
          assert len(d['regimes'])>=10
          for r in d['regimes']:
              assert r['winner']['tested']==r['tested']
          print({'steps':d['steps'],'winner':d['overall'][0],'regimes':len(d['regimes'])})
          PY
      - name: Commit regime results
        run: |
          git config user.name "apx-regime-bot"
          git config user.email "apx-regime-bot@users.noreply.github.com"
          git add apx/regime_results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update pre-draw regime performance results"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 4
          done
          exit 1
