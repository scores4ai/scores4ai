<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APX Audit</title><style>body{font-family:system-ui;background:#08111f;color:#eef6ff;margin:0;padding:18px}.wrap{max-width:760px;margin:auto}.card{background:#111d30;border:1px solid #263a57;border-radius:15px;padding:16px;margin:12px 0}.big{font-size:30px;font-weight:800}.ok{color:#62e6a7}.bad{color:#ff7b7b}.warn{color:#ffd166}.muted{color:#9eb0c8;font-size:14px}button{padding:11px 15px;border:0;border-radius:10px;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{padding:7px 0;border-bottom:1px solid #24344d}.pill{font-size:12px;padding:4px 8px;border-radius:99px;background:#20304a}pre{white-space:pre-wrap;font-size:11px}</style></head><body><div class="wrap"><h1>APX Research Audit</h1><div class="muted">Reads the files deployed on GitHub Pages. It does not infer job status.</div><div class="card"><div id="overall" class="big">CHECKING…</div><div id="checked" class="muted"></div><p><button onclick="run()">Check now</button></p></div><div class="row"><div class="card"><div class="muted">Usable real draws</div><div id="draws" class="big">—</div><div id="range"></div></div><div class="card"><div class="muted">5,000-draw archive</div><div id="target" class="big">—</div><div id="targetnote"></div></div></div><div class="card"><b>Clean archive</b><div id="archive"></div></div><div class="card"><b>Pattern experiments actually present</b><div id="results"></div></div><div class="card"><b>Raw check</b><pre id="raw"></pre></div></div><script>
const ROOT='/scores4ai/';
async function load(path){try{const r=await fetch(ROOT+path+'?v='+Date.now(),{cache:'no-store'});const text=await r.text();if(!r.ok)return{path,ok:false,status:r.status};try{return{path,ok:true,status:r.status,data:JSON.parse(text)}}catch(e){return{path,ok:false,status:r.status,error:'invalid JSON'}}}catch(e){return{path,ok:false,error:String(e)}}}
function unwrap(d){for(let i=0;i<3;i++){if(typeof d==='string'){try{d=JSON.parse(d)}catch(e){break}}else if(d&&typeof d==='object'&&typeof d.content==='string'){try{d=JSON.parse(d.content)}catch(e){break}}else break}return d}
function rowsOf(f){if(!f||!f.ok)return[];const d=unwrap(f.data);if(Array.isArray(d))return d;if(d&&Array.isArray(d.draws))return d.draws;if(d&&Array.isArray(d.rows))return d.rows;return[]}
function item(f){return `<div class="item"><span class="pill">${f.ok?'HTTP 200':'HTTP '+(f.status||'ERROR')}</span> ${f.path}</div>`}
async function run(){overall.textContent='CHECKING…';const paths=['v0/cloud_state.json','research/clean_cashpop_archive.json','research/archive_metadata.json','research/three_pattern_models_results.json','research/pattern_trio_results.json','research/arc_chain_results.json','research/distance_grammar_selective_v1_results.json','research/distance_grammar_similarity_v2_results.json'];const fs=await Promise.all(paths.map(load));const state=fs[0],clean=fs[1],meta=fs[2],results=fs.slice(3);const rows=rowsOf(state);const ids=rows.map(x=>Number(x.draw)).filter(Number.isFinite);draws.textContent=rows.length.toLocaleString();range.textContent=ids.length?`#${Math.min(...ids)} → #${Math.max(...ids)}`:'No readable draw rows';const cr=rowsOf(clean);const ready=clean.ok&&cr.length>=5000;target.textContent=ready?'READY':'NOT READY';target.className='big '+(ready?'ok':'bad');targetnote.textContent=clean.ok?`${cr.length.toLocaleString()} clean rows deployed`:'clean_cashpop_archive.json is not deployed';archive.innerHTML=item(clean)+item(meta);resultsEl=results;document.getElementById('results').innerHTML=results.map(item).join('');overall.textContent=ready?'CLEAN DATA READY':'CURRENT DATA ONLY';overall.className='big '+(ready?'ok':'warn');checked.textContent='Verified '+new Date().toLocaleString();raw.textContent=JSON.stringify(fs.map(f=>({path:f.path,http:f.status||null,ok:f.ok,rows:rowsOf(f).length,error:f.error||null})),null,2)}
run();setInterval(run,30000);
</script></body></html>
