<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adaptive Predictor Ultra Live</title>
<style>
body{margin:0;background:#0b0f19;color:#eef3ff;font-family:Arial,sans-serif}.w{max-width:900px;margin:auto;padding:14px}.c{background:#121827;border:1px solid #26314b;border-radius:18px;padding:16px;margin:12px 0}.m{color:#9baccc;font-size:13px}.hero{text-align:center}.five{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.pick{background:#222c45;border:1px solid #354362;border-radius:15px;padding:12px 4px;text-align:center}.pick:first-child{background:#7c5cff}.pick b{font-size:28px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#171f31;border:1px solid #26314b;border-radius:13px;padding:10px}.stat b{display:block;font-size:18px;margin-top:4px}.ok{color:#28c76f}.bad{color:#ff5b6e}.warn{color:#ffb020}.connected{color:#28c76f;font-weight:bold}table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid #26314b;text-align:left;font-size:12px}button{border:0;border-radius:12px;padding:11px 14px;background:#7c5cff;color:#fff;font-weight:bold}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.five{gap:5px}.pick b{font-size:22px}}
</style></head><body><div class="w">
<div class="c"><h2 style="margin:0">Adaptive Predictor Ultra Live</h2><div class="m">Raw main-branch feed · checks every 3 seconds · no manual entry</div></div>
<div class="c hero"><div class="m" id="status">Loading live state…</div><h3 id="next">NEXT DRAW</h3><div class="five" id="five"></div><div class="m" id="feed" style="margin-top:10px"></div><div class="m" id="transport" style="margin-top:6px"></div><div style="margin-top:12px"><button id="refreshBtn">Refresh now</button></div></div>
<div class="c"><div class="stats"><div class="stat"><span class="m">Draws loaded</span><b id="seed">—</b></div><div class="stat"><span class="m">Evaluated</span><b id="evaluated">—</b></div><div class="stat"><span class="m">Successes</span><b id="successes">—</b></div><div class="stat"><span class="m">Misses</span><b id="misses">—</b></div></div></div>
<div class="c"><h3>Latest draws</h3><div style="overflow:auto;max-height:430px"><table><thead><tr><th>Draw</th><th>Date/time</th><th>Number</th></tr></thead><tbody id="drawRows"></tbody></table></div></div>
<div class="c"><h3>Success and miss history</h3><div style="overflow:auto;max-height:620px"><table><thead><tr><th>Draw</th><th>Predicted five</th><th>Actual</th><th>Result</th><th>Type</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div><script>
let loading=false;
const RAW='https://raw.githubusercontent.com/scores4ai/scores4ai/main/v0/cloud_state.json';
const $=id=>document.getElementById(id);
function ageMinutes(iso){if(!iso)return 9999;return(Date.now()-new Date(iso).getTime())/60000}
function render(s){const p=s.pending||{},st=s.stats||{},draws=s.draws||[],age=ageMinutes(s.updatedAt);$('status').innerHTML=(age<3?'<span class="connected">● CURRENT STATE RECEIVED</span>':'<span class="warn">● STATE DELAYED</span>')+' · updated '+(s.updatedAt?new Date(s.updatedAt).toLocaleString():'unknown')+' · checked '+new Date().toLocaleTimeString();$('next').textContent=p.draw?'NEXT DRAW #'+p.draw:'Waiting for prediction';$('five').innerHTML=(p.top5||[]).map((n,i)=>'<div class="pick"><span class="m">#'+(i+1)+'</span><br><b>'+n+'</b></div>').join('');const latest=s.latestDraw||Math.max(0,...draws.map(x=>x.draw));$('feed').textContent='Latest completed draw #'+latest;$('seed').textContent=draws.length;$('evaluated').textContent=st.evaluated||0;$('successes').textContent=st.successes||0;$('misses').textContent=st.misses||0;$('drawRows').innerHTML=draws.slice(-150).reverse().map(x=>'<tr><td>#'+x.draw+'</td><td>'+((x.date||'')+' '+(x.time||'')).trim()+'</td><td><b>'+x.number+'</b></td></tr>').join('');$('rows').innerHTML=(s.history||[]).slice(-250).reverse().map(x=>'<tr><td>#'+x.draw+'</td><td>'+((x.top5||[]).join(', '))+'</td><td><b>'+x.actual+'</b></td><td class="'+(x.hit5?'ok':'bad')+'">'+(x.hit5?'SUCCESS':'MISS')+'</td><td>'+String(x.type||'').replaceAll('_',' ')+'</td></tr>').join('')}
async function loadState(){if(loading)return;loading=true;const started=performance.now();try{const r=await fetch(RAW+'?cb='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});if(!r.ok)throw new Error('Raw feed HTTP '+r.status);const text=await r.text();const state=JSON.parse(text);render(state);$('transport').innerHTML='<span class="ok">Raw feed received in '+Math.round(performance.now()-started)+' ms</span>'}catch(e){$('transport').innerHTML='<span class="bad">Live feed error: '+e.message+'</span>'}finally{loading=false}}
$('refreshBtn').addEventListener('click',loadState);loadState();setInterval(loadState,3000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadState()});
</script></body></html>
