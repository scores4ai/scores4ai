const STATE='https://raw.githubusercontent.com/scores4ai/scores4ai/main/v0/cloud_state.json';
let current=EMBEDDED,lastCloudCheck=null;

function render(s,source){
 const p=s.pending,st=s.stats||{};
 document.getElementById('status').textContent=(source==='cloud'?'Cloud updated':'Embedded backup loaded')+
   ' · '+(s.updatedAt?new Date(s.updatedAt).toLocaleString():'no timestamp')+
   (lastCloudCheck?' · checked '+lastCloudCheck.toLocaleTimeString():'');
 document.getElementById('next').textContent=p?'NEXT DRAW #'+p.draw:'Waiting for prediction';
 document.getElementById('five').innerHTML=p?p.top5.map((n,i)=>'<div class="pick"><span class="m">#'+(i+1)+'</span><br><b>'+n+'</b></div>').join(''):'';
 const latest=s.latestDraw||Math.max(...(s.draws||[]).map(x=>x.draw));
 document.getElementById('feed').innerHTML='<span class="connected">● ACTIVE</span> · Latest completed draw #'+latest;
 document.getElementById('seed').textContent=(s.draws||[]).length;
 document.getElementById('evaluated').textContent=st.evaluated||0;
 document.getElementById('successes').textContent=st.successes||0;
 document.getElementById('misses').textContent=st.misses||0;
 document.getElementById('rows').innerHTML=(s.history||[]).slice(-300).reverse().map(x=>
 '<tr><td>#'+x.draw+'</td><td>'+x.top5.join(', ')+'</td><td><b>'+x.actual+'</b></td><td class="'+(x.hit5?'ok':'bad')+'">'+(x.hit5?'SUCCESS':'MISS')+'</td><td>'+String(x.type||'').replaceAll('_',' ')+'</td></tr>'
 ).join('');
}

async function loadCloud(manual=false){
 lastCloudCheck=new Date();
 try{
   const r=await fetch(STATE+'?t='+Date.now(),{cache:'no-store'});
   if(!r.ok)throw new Error('HTTP '+r.status);
   const s=await r.json();
   if((s.draws||[]).length >= (current.draws||[]).length) current=s;
   render(current,'cloud');
 }catch(e){
   render(current,'embedded');
   document.getElementById('status').textContent+=' · cloud check failed';
 }
}
render(current,'embedded');
loadCloud();
setInterval(()=>loadCloud(false),15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadCloud(false)});
</script>
