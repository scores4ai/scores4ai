<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adaptive Predictor Seeded</title><style>body{margin:0;background:#0b0f19;color:#eef3ff;font-family:Arial}.w{max-width:820px;margin:auto;padding:14px}.c{background:#121827;border:1px solid #26314b;border-radius:18px;padding:16px;margin:12px 0}.m{color:#9baccc;font-size:13px}.five{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.pick{background:#222c45;border-radius:14px;padding:13px;text-align:center}.pick:first-child{background:#7c5cff}.pick b{font-size:28px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#171f31;border-radius:13px;padding:10px}.stat b{display:block;font-size:18px;margin-top:4px}.ok{color:#28c76f}.bad{color:#ff5b6e}table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid #26314b;text-align:left;font-size:12px}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.five{gap:5px}}</style></head><body><div class="w"><div class="c"><h2 style="margin:0">Adaptive Predictor Cloud</h2><div class="m" id="status">Loading seeded model…</div></div><div class="c"><h3 id="next">NEXT DRAW</h3><div class="five" id="five"></div></div><div class="c"><div class="stats"><div class="stat"><span class="m">Seed draws</span><b id="draws">—</b></div><div class="stat"><span class="m">Evaluated</span><b id="eval">—</b></div><div class="stat"><span class="m">Successes</span><b id="succ">—</b></div><div class="stat"><span class="m">Misses</span><b id="miss">—</b></div></div></div><div class="c"><h3>Recent record</h3><div style="overflow:auto;max-height:500px"><table><thead><tr><th>Draw</th><th>Predicted five</th><th>Actual</th><th>Result</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>const S='https://raw.githubusercontent.com/scores4ai/scores4ai/main/v0/cloud_state.json',D='https://raw.githubusercontent.com/scores4ai/scores4ai/main/v0/seed_draws.json';function top5(a){let c=Array(15).fill(.5);a.forEach(x=>c[x-1]++);return c.map((v,i)=>({n:i+1,v})).sort((x,y)=>y.v-x.v||x.n-y.n).slice(0,5).map(x=>x.n)}function replay(pairs){let seq=[],h=[];for(let i=0;i<pairs.length;i++){if(seq.length>=20){let p=top5(seq),a=pairs[i][1];h.push({draw:pairs[i][0],top5:p,actual:a,hit5:p.includes(a)})}seq.push(pairs[i][1])}return{history:h,pending:{draw:pairs[pairs.length-1][0]+1,top5:top5(seq)},draws:pairs.map(x=>({draw:x[0],number:x[1]}))}}function show(s,seeded){let h=s.history||[],su=h.filter(x=>x.hit5).length,p=s.pending;status.textContent=(seeded?'Seed fallback active now; cloud automation is initializing. ':'Cloud model active. ')+(s.updatedAt?'Updated '+new Date(s.updatedAt).toLocaleString():'');next.textContent=p?'NEXT DRAW #'+p.draw:'Waiting';five.innerHTML=p?p.top5.map((n,i)=>'<div class="pick"><span class="m">#'+(i+1)+'</span><br><b>'+n+'</b></div>').join(''):'';draws.textContent=(s.draws||[]).length;eval.textContent=h.length;succ.textContent=su;miss.textContent=h.length-su;rows.innerHTML=h.slice(-200).reverse().map(x=>'<tr><td>#'+x.draw+'</td><td>'+x.top5.join(', ')+'</td><td><b>'+x.actual+'</b></td><td class="'+(x.hit5?'ok':'bad')+'">'+(x.hit5?'SUCCESS':'MISS')+'</td></tr>').join('')}async function load(){try{let r=await fetch(S+'?t='+Date.now(),{cache:'no-store'}),s=await r.json();if((s.draws||[]).length)return show(s,false)}catch(e){}let r=await fetch(D+'?t='+Date.now(),{cache:'no-store'}),pairs=await r.json();show(replay(pairs),true)}load();setInterval(load,60000);</script></body></html>
