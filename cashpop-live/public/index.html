<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cash Pop Live Signal</title><style>body{font-family:system-ui;background:#0b0d12;color:#fff;margin:0;padding:18px}.card{max-width:680px;margin:12px auto;background:#151922;border:1px solid #2a3140;border-radius:18px;padding:18px}h1{margin:0 0 6px}.muted{color:#9da7b7}.big{font-size:30px;font-weight:800}.on{color:#53e6a1}.off{color:#9da7b7}.nums{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.n{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#222936;font-size:22px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.m{background:#0f131a;border-radius:12px;padding:12px}</style></head><body><div class="card"><h1>Michigan Cash Pop</h1><div class="muted" id="status">Connecting…</div></div><div class="card"><div class="muted">LATEST DRAW</div><div class="big" id="latest">—</div></div><div class="card"><div class="muted">NEXT-DRAW UNIQUE-5 SIGNAL</div><div class="big off" id="signal">OFF</div><div class="nums" id="nums"></div><div class="grid"><div class="m">Backtest<br><b id="rate">—</b></div><div class="m">Baseline<br><b>33.3%</b></div><div class="m">Signals<br><b id="count">—</b></div><div class="m">Miss streak<br><b id="miss">—</b></div></div></div><script>async function tick(){try{const s=await fetch('/api/state?'+Date.now()).then(r=>r.json());status.textContent=s.status+(s.lastUpdate?' • updated '+new Date(s.lastUpdate).toLocaleTimeString():'');latest.textContent=s.latest?('#'+s.latest.drawNumber+' = '+s.latest.value):'Waiting for first captured draw';signal.textContent=s.signalOn?'ON':'OFF';signal.className='big '+(s.signalOn?'on':'off');nums.innerHTML='';(s.candidates||[]).forEach(x=>{let d=document.createElement('div');d.className='n';d.textContent=x;nums.appendChild(d)});rate.textContent=s.hitRate==null?'—':(s.hitRate*100).toFixed(1)+'%';count.textContent=s.qualifyingSignals;miss.textContent=s.missStreak}catch(e){status.textContent='Reconnecting…'}}tick();setInterval(tick,5000);</script></body></html>
