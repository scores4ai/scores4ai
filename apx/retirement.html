<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APX Model Retirement</title><style>body{margin:0;background:#090d17;color:#eef3ff;font-family:Arial}.w{max-width:900px;margin:auto;padding:16px}.c{background:#121827;border:1px solid #293552;border-radius:18px;padding:18px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.s{background:#1a2338;border:1px solid #34415e;border-radius:14px;padding:14px;text-align:center}.s b{display:block;font-size:28px;margin-top:5px}.m{color:#9dabca}.ok{color:#2bd47d}.bad{color:#ff6475}.warn{color:#ffb020}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #293552;text-align:left;font-size:13px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="w"><div class="c"><h1>APX Model Retirement</h1><div class="m">Poor models remain archived and evaluated, but no longer vote in the live ensemble.</div></div><div class="c"><div id="status" class="m">Loading…</div><div class="stats"><div class="s"><span class="m">Active</span><b id="active">—</b></div><div class="s"><span class="m">Retired</span><b id="retired">—</b></div><div class="s"><span class="m">Total tracked</span><b id="total">—</b></div></div><p id="rule" class="m"></p></div><div class="c"><h2>Retired models</h2><div style="overflow:auto"><table><thead><tr><th>Model</th><th>Lifetime</th><th>Rolling 50</th><th>Weight</th><th>Status</th></tr></thead><tbody id="retiredRows"></tbody></table></div></div><div class="c"><h2>Active models</h2><div style="overflow:auto;max-height:600px"><table><thead><tr><th>Model</th><th>Lifetime</th><th>Rolling 50</th><th>Voting weight</th></tr></thead><tbody id="activeRows"></tbody></table></div></div></div><script>const API='https://api.github.com/repos/scores4ai/scores4ai/contents/apx/state.json?ref=main';const $=x=>document.getElementById(x);const pct=x=>(100*(Number(x)||0)).toFixed(1)+'%';function decode(v){const b=atob(String(v||'').replace(/\n/g,''));return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))}async function load(){try{const r=await fetch(API+'&cb='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('GitHub API '+r.status);const e=await r.json(),s=JSON.parse(decode(e.content)),mr=s.modelRetirement||{},board=s.leaderboard||[],active=board.filter(x=>x.status!=='retired'),retired=board.filter(x=>x.status==='retired');$('status').innerHTML='<span class="ok">● ACTIVE</span> · '+s.version+' · latest draw #'+s.latestDraw;$('active').textContent=mr.activeCount??active.length;$('retired').textContent=mr.retiredCount??retired.length;$('total').textContent=s.totalModelCount??board.length;$('rule').textContent=mr.rule||'The retirement cycle has not produced its first state yet.';$('retiredRows').innerHTML=retired.map(x=>'<tr><td><b>'+x.name+'</b></td><td>'+pct(x.accuracy)+'</td><td>'+pct(x.rolling50)+'</td><td>'+Number(x.weight||0).toFixed(2)+'</td><td class="bad">RETIRED</td></tr>').join('')||'<tr><td colspan="5" class="m">No models are retired yet.</td></tr>';$('activeRows').innerHTML=active.map(x=>'<tr><td><b>'+x.name+'</b></td><td>'+pct(x.accuracy)+'</td><td>'+pct(x.rolling50)+'</td><td>'+Number(x.votingWeight??x.weight??0).toFixed(2)+'</td></tr>').join('')}catch(e){$('status').textContent='Unavailable · '+e.message}}load();setInterval(load,20000)</script></body></html>
